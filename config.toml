[logging]
mode = "file"                                                                      # Modo de registro: "file" para archivo, "console" para consola, "database" para base de datos, puede ser una lista separada por comas para múltiples modos, por ejemplo: "file,console"
filename = "./logs/AnalizadorDeOpiniones-{DATE}.log"                                       # Nombre del archivo de log
format_type = "standard"                                                                   # Tipo de formato de los logs: "standard" para un formato estándar, "json" para un formato JSON
format = "%(asctime)s [%(levelname)s] (%(name)s) (%(filename)s:%(lineno)d) %(message)s"    # Formato de los logs (desarrollo / test)
encoding = "utf-8"                                                                         # Codificación del archivo de log
filemode = "w"                                                                             # Modo de apertura del archivo de log ('a' para añadir, 'w' para sobrescribir)
level = "INFO"                                                                             # Nivel mínimo a registrar: DEBUG, INFO, WARNING, ERROR, CRITICAL
database_url = "sqlite:///./{LOGGING_DATABASE_NAME}.db"                                    # URL de la base de datos para el registro en caso de usar "database" como modo de registro
# database_url = "mysql+mysqlconnector://{LOGGING_DATABASE_USER}:{LOGGING_DATABASE_PASSWORD}@{LOGGING_DATABASE_HOST}:{LOGGING_DATABASE_PORT}/{LOGGING_DATABASE_NAME}"   # URL de la base de datos para el registro en caso de usar "database" como modo de registro
# database_url = "postgresql+psycopg2://{LOGGING_DATABASE_USER}:{LOGGING_DATABASE_PASSWORD}@{LOGGING_DATABASE_HOST}:{LOGGING_DATABASE_PORT}/{LOGGING_DATABASE_NAME}"    # URL de la base de datos para el registro en caso de usar "database" como modo de registro
database_table = "log_analizador_de_opiniones"                                             # Nombre de la tabla de la base de datos para el registro en caso de usar "database" como modo de registro
max_bytes = 10485760
backup_count = 10

[model]
name = "paraphrase-multilingual-MiniLM-L12-v2"                                             # Modelo de embeddings a utilizar. Ejemplos: "paraphrase-multilingual-MiniLM-L12-v2", "all-MiniLM-L6-v2" 
# name = "all-MiniLM-L6-v2"                                                                  # Modelo de embeddings a utilizar. Ejemplos: "paraphrase-multilingual-MiniLM-L12-v2", "all-MiniLM-L6-v2" 

[inputs]
expresiones_a_descartar = "expresiones_a_descartar.txt"                                    # Archivo de texto que contiene expresiones a descartar en el procesamiento de texto
frases_de_referencia = "frases_de_referencia.txt"                                          # Archivo de texto que contiene frases de referencia para el procesamiento de texto
opiniones = "opiniones.txt"                                                                # Archivo de texto que contiene opiniones para el procesamiento de texto
